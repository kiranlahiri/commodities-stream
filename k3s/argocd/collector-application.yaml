apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commodities-collector
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kiranlahiri/commodities-stream.git
    targetRevision: main
    path: k3s/collector

  destination:
    server: https://kubernetes.default.svc
    namespace: market-data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
